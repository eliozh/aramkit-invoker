[package]
name = "aramkit-invoker"
version = "0.1.1"
edition = "2021"
description = "League of Legends ARAM Mayhem helper that opens ARAMKit champion pages automatically"
license = "MIT"
exclude = ["examples/LeagueClientUx/"]

[[example]]
name = "LeagueClientUx"
path = "examples/LeagueClientUx/main.rs"

[dependencies]
anyhow = "1"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "x11", "wayland", "clipboard", "links"] }
egui = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
tempfile = "3"
webbrowser = "1.2"
zeroize = "1"

[dev-dependencies]
libc = "=0.2.191"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
httparse = "=1.10.1"
base64 = "=0.22.1"
getrandom = "=0.3.4"

[target.'cfg(windows)'.dependencies]
rfd = "0.17"
tray-icon = "0.26"
tungstenite = "0.30"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
strip = true
